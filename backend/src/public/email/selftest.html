<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>فحص نظام البريد — ArabDiving</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background:#0b1a2e; color:#e8eef5; margin:0; padding:26px 16px; }
    .box { max-width:640px; margin:0 auto; background:#12253f; border:1px solid #21406b; border-radius:16px; padding:26px; }
    h1 { font-size:21px; color:#4fc3f7; margin:0 0 6px; }
    p.sub { color:#93a9c2; font-size:13px; line-height:1.9; margin:0 0 20px; }
    label { display:block; font-size:13px; color:#a9c0d8; margin:14px 0 6px; font-weight:bold; }
    input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #2c4d7d;
            background:#0d1c31; color:#fff; font-family:inherit; font-size:15px; }
    button { width:100%; margin-top:18px; padding:14px; border:none; border-radius:10px; cursor:pointer;
             background:linear-gradient(135deg,#0891b2,#06b6d4); color:#fff; font-weight:bold; font-size:16px; font-family:inherit; }
    button:disabled { opacity:.5; cursor:default; }
    pre { background:#08101d; border:1px solid #21406b; border-radius:10px; padding:14px; margin-top:18px;
          white-space:pre-wrap; word-break:break-all; font-size:12.5px; line-height:1.7; color:#c8d8e8; direction:ltr; text-align:left; display:none; }
    .verdict { margin-top:16px; padding:14px 16px; border-radius:10px; font-size:15px; font-weight:bold; line-height:1.8; display:none; }
    .ok { background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.4); color:#6ee7b7; }
    .bad { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:#fca5a5; }
    .hint { color:#7f95ad; font-size:12px; margin-top:14px; line-height:1.8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔬 فحص نظام البريد</h1>
    <p class="sub">
      يختبر ثلاثة أشياء دفعة واحدة: الكتابة في قاعدة البيانات، الاتصال بخادم SMTP، ثم إرسال رسالة فعلية —
      ويعرض سبب أي رفض حرفيًا. الصق المفتاح هنا بدل كتابته في الرابط (يتجنّب قطع الرموز والإكمال التلقائي).
    </p>

    <label for="key">مفتاح الفحص (MAIL_TEST_KEY)</label>
    <input id="key" type="text" placeholder="الصق المفتاح كما هو في ريندر" autocomplete="off" spellcheck="false" />

    <label for="to">أرسل الرسالة إلى</label>
    <input id="to" type="email" placeholder="you@example.com" autocomplete="off" />

    <button id="btn">ابدأ الفحص</button>

    <div id="verdict" class="verdict"></div>
    <pre id="out"></pre>
    <p class="hint" id="len"></p>
  </div>

<script>
  var btn = document.getElementById('btn');
  var out = document.getElementById('out');
  var verdict = document.getElementById('verdict');
  var lenHint = document.getElementById('len');

  btn.addEventListener('click', async function () {
    var key = document.getElementById('key').value.trim();
    var to  = document.getElementById('to').value.trim();
    if (!key || !to) { alert('أدخل المفتاح والبريد'); return; }

    btn.disabled = true; btn.textContent = 'جارٍ الفحص... (قد يستغرق دقيقة إن كان الخادم نائمًا)';
    verdict.style.display = 'none'; out.style.display = 'none';
    lenHint.textContent = 'طول المفتاح الذي أرسلته: ' + key.length + ' حرفًا';

    try {
      // encodeURIComponent يحمي الرموز الخاصة (# & +) من القطع
      var url = '/api/newsletter/selftest?key=' + encodeURIComponent(key) + '&to=' + encodeURIComponent(to);
      var res = await fetch(url, { cache: 'no-store' });
      var data = await res.json();

      out.textContent = JSON.stringify(data, null, 2);
      out.style.display = 'block';

      var v = data.verdict || data.message || 'لا نتيجة';
      verdict.textContent = v;
      verdict.className = 'verdict ' + (String(v).indexOf('✅') === 0 ? 'ok' : 'bad');
      verdict.style.display = 'block';
    } catch (err) {
      verdict.textContent = 'تعذّر الاتصال بالخادم: ' + err.message;
      verdict.className = 'verdict bad';
      verdict.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'ابدأ الفحص';
    }
  });
</script>
</body>
</html>
