<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>اشترك في مجتمع ArabDiving 🤿</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Tahoma,Arial,sans-serif; background:linear-gradient(135deg,#0b6ea8,#083d5c); color:#1a2b3c; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .card { background:#fff; width:100%; max-width:460px; border-radius:18px; padding:34px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    h1 { color:#0b6ea8; font-size:24px; margin:0 0 6px; }
    p.sub { color:#5a6b7a; margin:0 0 22px; font-size:14px; line-height:1.8; }
    label { display:block; font-size:13px; font-weight:bold; margin:14px 0 6px; }
    input, select { width:100%; padding:12px; border:1.5px solid #d6e0e8; border-radius:10px; font-size:15px; font-family:inherit; }
    input:focus, select:focus { outline:none; border-color:#0b6ea8; }
    .consent { display:flex; gap:10px; align-items:flex-start; margin:18px 0; font-size:12.5px; color:#5a6b7a; line-height:1.7; }
    .consent input { width:auto; margin-top:3px; }
    button { width:100%; background:#0b6ea8; color:#fff; border:0; padding:14px; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:8px; }
    button:hover { background:#095a8a; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:16px; padding:12px; border-radius:10px; font-size:14px; text-align:center; display:none; }
    .msg.ok { background:#e6f7ee; color:#0a7a43; }
    .msg.err { background:#fdeaea; color:#c0392b; }
    .logo { font-size:40px; text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🤿</div>
    <h1>انضم لمجتمع الغوص</h1>
    <p class="sub">أفضل مواقع الغوص في البحر الأحمر، نصائح، وعروض حصرية للأعضاء — في السعودية ومصر.</p>

    <form id="form">
      <label>الاسم</label>
      <input name="name" placeholder="اسمك" />

      <label>البريد الإلكتروني *</label>
      <input name="email" type="email" required placeholder="you@example.com" />

      <label>أنت...</label>
      <select name="role">
        <option value="trainee">متدرّب / مهتم بالغوص</option>
        <option value="instructor">مدرّب غوص</option>
        <option value="general">فضولي / أستكشف</option>
      </select>

      <div class="consent">
        <input type="checkbox" name="consent" id="consent" required />
        <label for="consent" style="margin:0;font-weight:normal;">
          أوافق على استلام النشرة البريدية والعروض من ArabDiving، وأعلم أنه يمكنني إلغاء الاشتراك في أي وقت.
        </label>
      </div>

      <button type="submit" id="btn">اشترك الآن</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';

      const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        role: form.role.value,
        consent: form.consent.checked,
        source: 'subscribe-page'
      };

      try {
        const res = await fetch('/api/newsletter/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        msg.textContent = json.message;
        msg.className = 'msg ' + (json.success ? 'ok' : 'err');
        msg.style.display = 'block';
        if (json.success) form.reset();
      } catch (err) {
        msg.textContent = 'حدث خطأ، حاول مرة أخرى.';
        msg.className = 'msg err';
        msg.style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = 'اشترك الآن';
      }
    });
  </script>
</body>
</html>
